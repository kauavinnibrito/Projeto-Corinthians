name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publica só a versão estática (index.html + CSS e JS usados por ela).
      # O back-end Flask e o banco MySQL não vão para o Pages.
      - name: Montar o site
        run: |
          mkdir -p _site/app/static
          cp index.html _site/
          cp -r app/static/css app/static/js _site/app/static/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
